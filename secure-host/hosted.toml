# What the action sets up when its `config` input names no file, for
# GitHub's hosted `ubuntu-26.04` (agentic-job's secure-host/hosted.toml,
# with the runner-only contract's settings). The action adds
# `sandbox.runner-user`; the image's `agentic-job config --host` checks
# the whole file. Another runner image listens on other sockets: the
# probes fail on each one that is left and name it.

[sandbox]
# Every later step runs as the runner's user, without root.
lock-runner = true
# No later step reaches the cloud metadata service: no instance identity
# or cloud role credentials. Needs lock-runner.
deny-runner-metadata = true
# Stop later steps reading tokens from another runner process's environment.
# Needs lock-runner; the image leaves this rule off unless requested.
deny-runner-reads = true
# Daemons of the image that listen for every local user. A job that
# needs one of them after this step cannot have it: the runner's user is
# in docker's group, which is root by another name.
stop-services = [
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "iscsid.socket",
    "iscsid.service",
]
close-resolved = true

[sandbox.check]
allow-sockets = [
    # systemd-networkd, which the runner's network depends on: it
    # describes the links to any user and changes them only for root.
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# The action's egress: write-policy input opts into the runner write policy.
[egress]
proxy = false

[setup]
# The network rules that refuse the metadata service.
packages = ["nftables"]
