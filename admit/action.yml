name: Admit
description: >-
  Fail unless the calling repository's owner is listed, by numeric id, in
  this action's owners.json.
runs:
  using: composite
  steps:
    - name: Check the repository owner
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        OWNER_ID: ${{ github.repository_owner_id }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if ! [[ "$OWNER_ID" =~ ^[1-9][0-9]*$ ]] ||
          ! jq -e --arg id "$OWNER_ID" 'any(.[]; tostring == $id)' "$ACTION_PATH/owners.json" > /dev/null; then
          echo "::error::$OWNER (id $OWNER_ID) is not an owner admit/owners.json lists"
          exit 1
        fi
        echo "$OWNER (id $OWNER_ID) is admitted"
