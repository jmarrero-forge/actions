# Third-party actions, agentic-job included, are pinned by commit with
# their release tag in a comment, which is what lets this move them. Our
# own tailscale action is not pinned: the wrappers take it from the commit
# they run at.
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions' own pins.
    directories: [/, /tailscale, /lint]
    schedule:
      interval: daily
    # policy, check and apply must name the same commit (the run refuses
    # calls at differing commits), so a new release is one pull request for
    # all three, and for the review wrapper's calls, kept at the same one.
    groups:
      agentic-job:
        patterns: ["cgwalters-forge/agentic-job*"]
    # A release that turns out to be compromised is usually pulled within
    # days; checking daily but taking only week-old versions avoids pinning
    # one in the meantime. agentic-job is someone else's here, so it waits
    # like the rest.
    cooldown:
      default-days: 7
