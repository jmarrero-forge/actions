name: review
on:
  # The base's reusable workflow runs; no step here checks out or runs the
  # head (review.test.mjs enforces that), so this trigger is accepted.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    # Off until the repository variable AGENT_REVIEW names the reviewing
    # agent: the wrapper has no fallback agent or broker, and would fail
    # every pull request's review in policy until a broker admits it.
    if: >-
      vars.AGENT_REVIEW != '' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    # The wrapper of this repository, at the base's commit, composes
    # agentic-job at a commit it pins with jmarrero-forge's tailnet join:
    # agentic-job's own review.yml joins cgwalters' tailnet, which has no
    # entry for this organization.
    uses: ./.github/workflows/jmarrero-review.yml
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
