# Composed from agentic-job v0.6.2's review.yml: keep event policy and
# publication semantics there in sync when updating the three pinned calls.
# They name the release's commit, not its tag, for the reason
# cgwalters-agentic-job.yml's header gives.
# No dispatcher inputs: identity/configuration comes from repository variables.
name: cgwalters-review
on:
  workflow_call:
    secrets:
      SAFE_OUTPUTS_PAT:
        required: false
permissions: {}
jobs:
  # The agent job runs on the caller's AGENT_RUNNER, where a self-hosted
  # runner's owner could mint identity tokens with this file's
  # `job_workflow_ref` for any audience: refuse an owner not ours on a
  # hosted runner first (admit/README.md). Everything else needs policy.
  admit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: cgwalters-forge/actions/admit@main

  policy:
    needs: admit
    # Untrusted authors must not drain the shared inference budget by opening
    # or reopening PRs. Otherwise-unassociated bots are off by default,
    # admitted by immutable id AND bounds. Preserve upstream's association
    # admission for all authors. /review requires write access in policy.
    # Never for a private repository, whatever its bounds say: agentic-job's
    # opt-in (its #739) would send its source through our shared inference
    # proxy and runners.
    if: >-
      github.event.repository.visibility == 'public' && (
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
          (github.event.pull_request.user.type == 'Bot' && startsWith(vars.REVIEW_BOT_IDS, '[') &&
            contains(fromJSON(vars.REVIEW_BOT_IDS || '[]'), github.event.pull_request.user.id)))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@258dc11ca7fe1798836976c0424274d1498e22cb # v0.6.2
    permissions:
      contents: read
    with:
      id: review-${{ github.event.pull_request.number || github.event.issue.number }}
      repo: ${{ github.repository }}
      event: true
      review: true
      review-task: workflow/review.md
      task: ''
      kind: analysis
      outputs: add_comment,noop
      max-outputs: '1'
      notify: none
      allow: ${{ github.event_name == 'issue_comment' && 'workflow/review-command.toml' || 'workflow/review.toml' }}
      config: ${{ vars.AGENT_CONFIG || '.agentic-job-source/.github/agentic-job/hosted.toml' }}
      agent: ${{ vars.AGENT || 'opencode' }}
      model: ${{ vars.AGENT_MODEL || 'praxis/gpt-6.1-sol' }}
      # Repository names are configured by the owner, never dispatch inputs.
      agent-config-repo: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_REPO || '' }}
      agent-config-path: ${{ (vars.AGENT == '' || vars.AGENT == 'opencode' || vars.AGENT == 'vibe') && vars.AGENT_CONFIG_PATH || '' }}
      inference-url: ${{ vars.INFERENCE_URL || 'http://100.114.231.4:18080' }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      max-requests: '150'
      budget: '500'
      timeout: '75'

  refusal:
    needs: policy
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.policy.outputs.admitted == 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: agentic-job-status-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # As in the agent job: the helper must be the pinned source's.
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow
          persist-credentials: false
      - name: Report the policy refusal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ITEM: ${{ github.event.pull_request.number || github.event.issue.number }}
          REASON: ${{ needs.policy.outputs.reason }}
        run: node .agentic-job-source/workflow/review.cjs refusal

  agent:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    # Only admitted runs compete; comments cannot cancel an automatic review.
    concurrency:
      group: review-pull-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ${{ fromJSON(vars.AGENT_RUNNER || '"ubuntu-26.04"') }}
    timeout-minutes: 360
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      over-budget: ${{ steps.run.outputs.over-budget }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
      # Let the submitted review's footer link the agent job, not just the run.
      job: ${{ job.check_run_id }}
    steps:
      # The trusted base, never the head; source actions come from policy's pin.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      # Fail closed before running anything of the source: an empty output
      # would make checkout fall back to the calling repository or to the
      # default branch, unreleased code run as root here. The expected
      # repository is the one policy's `uses:` names (review.test.mjs).
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          echo "$SOURCE_REPOSITORY at $SOURCE_SHA"
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          persist-credentials: false
      - uses: ./.agentic-job-source/prepare # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          binary-artifact-id: ${{ needs.policy.outputs.binary-artifact-id }}
          policy-artifact-id: ${{ needs.policy.outputs.policy-artifact-id }}
      # One privileged network step, before secure-host drops root. The
      # tailnet and broker must admit this wrapper's job_workflow_ref with
      # an owner id admit/owners.json lists. Our own
      # action at main, as in cgwalters-agentic-job.yml: nothing moves a
      # commit pin here, so it would keep a retired client or hardening.
      - name: Join the tailnet
        uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: agentic-job-${{ github.run_id }}-${{ github.run_attempt }}
          # As in cgwalters-agentic-job.yml: unset, tailnets.json's entry.
          oauth-client-id: ${{ vars.AGENTIC_JOB_TAILSCALE_OAUTH_CLIENT_ID }}
          tags: ${{ vars.AGENTIC_JOB_TAILSCALE_TAGS }}
      # Fail on a missing proxy route before setup, not in its sandbox probes.
      # This TCP check sends no credentials and skips fake/no-proxy runs.
      - name: Check inference proxy reachability
        run: agentic-job secure-host inference .agentic-job/config.toml
      # internal, as upstream's review.yml: the public action now refuses `binary`.
      - uses: ./.agentic-job-source/secure-host/internal # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          binary: /usr/local/bin/agentic-job
          config: .agentic-job/config.toml
      - id: run
        timeout-minutes: 340
        uses: ./.agentic-job-source/run # zizmor: ignore[self-repository] Policy-selected pinned source, never head code.
        with:
          github-token: ${{ github.token }}

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    # check.yml's detect job asks for it; only that job takes it (see
    # cgwalters-agentic-job.yml). `actions: read` is for the digest check.
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@258dc11ca7fe1798836976c0424274d1498e22cb # v0.6.2
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  submit:
    needs: [policy, agent, check]
    if: >-
      ${{ !cancelled() && vars.AGENT_REAL_REVIEWS == 'true' && needs.policy.outputs.review-head != '' &&
          needs.check.result == 'success' && needs.check.outputs.artifact-id != '' &&
          contains(fromJSON('["APPROVE", "CHANGES"]'), needs.check.outputs.verdict) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      review-url: ${{ steps.submit.outputs.result }}
    steps:
      # As in the agent job: the helper must be the pinned source's.
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow/review.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Only check's upload from this run, never an agent-uploaded verdict.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: ${{ runner.temp }}/checked
      - name: Submit the checked verdict at the admitted head
        id: submit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          AGENT_EXIT: ${{ needs.agent.outputs.exit }}
          AGENT_JOB: ${{ needs.agent.outputs.job }}
          REAL_REVIEWS: ${{ vars.AGENT_REAL_REVIEWS }}
        with:
          result-encoding: string
          script: |
            const fs = require('node:fs');
            const { submitReview } = require(`${process.env.GITHUB_WORKSPACE}/.agentic-job-source/workflow/review.cjs`);
            const output = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/checked/agent_output.json`, 'utf8'));
            return await submitReview(process.env, output, github, core);

  apply:
    needs: [policy, agent, check, submit]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.submit.outputs.review-url == '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@258dc11ca7fe1798836976c0424274d1498e22cb # v0.6.2
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.SAFE_OUTPUTS_PAT }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}

  status:
    needs: [policy, agent, check, submit, apply]
    if: ${{ !cancelled() && needs.policy.outputs.review-head != '' && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # As in the agent job: the helper must be the pinned source's.
      - name: The policy call's source repository
        env:
          SOURCE_REPOSITORY: ${{ needs.policy.outputs.source-repository }}
          SOURCE_SHA: ${{ needs.policy.outputs.source-sha }}
          EXPECTED_REPOSITORY: cgwalters-forge/agentic-job
        run: |
          [[ "$SOURCE_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::the policy call is not $EXPECTED_REPOSITORY at a full commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.policy.outputs.source-repository }}
          ref: ${{ needs.policy.outputs.source-sha }}
          path: .agentic-job-source
          sparse-checkout: workflow/review.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Report the compatibility status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.policy.outputs.review-head }}
          CHECK_RESULT: ${{ needs.check.result }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RESULT_URL: ${{ needs.apply.outputs.result-url }}
          REVIEW_URL: ${{ needs.submit.outputs.review-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { reportStatus } = require(`${process.env.GITHUB_WORKSPACE}/.agentic-job-source/workflow/review.cjs`);
            await reportStatus(process.env, github, core);
