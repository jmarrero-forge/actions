# The one job named ci is what the main branch ruleset requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      # Relative links and anchors only: external sites make CI flaky.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true
      # The shared workflow check, called as other repositories call it.
      - uses: ./lint
      # just is on the path from the lint action; the tests run whether or
      # not its check passed.
      - name: lint unit tests
        if: ${{ !cancelled() }}
        run: just test-lint
      - name: event-review wrapper tests
        if: ${{ !cancelled() }}
        run: just test-review
      - name: admit unit tests
        if: ${{ !cancelled() }}
        run: just test-admit
      - name: secure-host unit tests
        if: ${{ !cancelled() }}
        run: just test-secure-host
      # sandbox-share on this runner: content, a file and a directory are
      # shared root-owned and read-only, and a symlink is refused.
      - name: Make files to share
        run: |
          mkdir -p share-test/dir && echo one >share-test/dir/a && echo two >share-test/file
          ln -s /etc/shadow share-test/shadow
      - uses: ./sandbox-share
        with:
          name: greeting
          content: hello from ${{ github.job }}
      - uses: ./sandbox-share
        with:
          name: file
          path: share-test/file
      - uses: ./sandbox-share
        with:
          name: dir
          path: share-test/dir
      - id: share-symlink
        continue-on-error: true
        uses: ./sandbox-share
        with:
          name: shadow
          path: share-test/shadow
      - name: Check sandbox-share's result
        env:
          SYMLINK: ${{ steps.share-symlink.outcome }}
        run: node sandbox-share/check.mjs
      - name: tailscale unit tests
        run: node --test tailscale/*.test.mjs
      - name: app-token unit tests
        run: node --test app-token/*.test.mjs
      - name: cgwalters-agentic-job unit tests
        run: node --test .github/workflows/*.test.mjs
      # tailscale without a tailnet: with no id-token permission the login
      # fails after tailscaled started (and after the job user reached its
      # LocalAPI, which the action's own readiness check does), so this
      # shows the socket closed even when joining fails.
      - id: tailscale
        continue-on-error: true
        uses: ./tailscale
        with:
          oauth-client-id: ci-no-login
          audience: ci-no-login
          tags: tag:ci-no-login
      - name: Check tailscale's result
        env:
          OUTCOME: ${{ steps.tailscale.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure || { echo "::error::joining should fail without id-token permission (outcome $OUTCOME)"; exit 1; }
          mode=$(sudo stat -c '%a %U' /var/run/tailscale)
          test "$mode" = "700 root" || { echo "::error::/var/run/tailscale is $mode"; exit 1; }
          echo "socket: $(sudo stat -c '%a %U' /var/run/tailscale/tailscaled.sock)"
          # The CLI is root's only too, which is what keeps the upstream
          # action's cleanup from running sudo at the end of the job.
          cli=$(sudo stat -c '%a %U' /usr/local/bin/tailscale)
          test "$cli" = "700 root" || { echo "::error::/usr/local/bin/tailscale is $cli"; exit 1; }
          if tailscale version >/dev/null 2>&1; then
            echo "::error::the job user can still run the tailscale CLI"; exit 1
          fi
          # A CLI of the job user's own must not get through either.
          sudo install -m 0755 -o "$(id -u)" /usr/local/bin/tailscale "$RUNNER_TEMP/tailscale"
          if "$RUNNER_TEMP/tailscale" status --json >/dev/null 2>err.txt; then
            echo "::error::the job user still reaches tailscaled's LocalAPI"; exit 1
          fi
          cat err.txt
          grep -q "permission denied" err.txt
          state=$(sudo tailscale status --json | jq -re .BackendState)
          echo "root: $state"
