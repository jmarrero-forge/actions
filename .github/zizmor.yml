# Our own workflows and actions follow a ref (main, or agentic-job's release
# tag) rather than a commit; everyone else's stay pinned by commit.
rules:
  unpinned-uses:
    config:
      policies:
        "jmarrero-forge/*": ref-pin
        "*": hash-pin
  # Suggests `$/` for every local action, ci.yml's included; we keep `./`
  # (./.agentic-job-source is another repository's checkout anyway).
  self-repository:
    disable: true
  # The wrappers pin our own actions at a commit, with `# main` for
  # Renovate to follow, so every later merge here makes the comment "mismatch".
  ref-version-mismatch:
    ignore:
      - cgwalters-agentic-job.yml
      - cgwalters-review.yml
