# Every action and reusable workflow of another repository, cgwalters'
# agentic-job and this repository's own tailscale action included, is
# pinned by commit: zizmor's hash-pin for all of them.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Suggests `$/` for every local action, ci.yml's included; we keep `./`
  # (./.agentic-job-source is another repository's checkout anyway).
  self-repository:
    disable: true
